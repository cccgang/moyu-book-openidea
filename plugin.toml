id = "owncode.moyu-book"
name = "Moyu Book"
version = "0.3.0"
description = "摸鱼看书：底部阅读面板（每页 5 段、字号/行数/行距可调），快捷键翻页，老板键一键伪装成 TODO 清单，阅读进度持久化。支持 UTF-8/GB18030 编码的 txt。"
authors = ["chen.g"]
license = "MIT"
change-notes = "0.3.0 — 插件更名 Moyu Book（原 Thief Book），插件 id 变为 owncode.moyu-book。新 id 与旧版数据不互通：安装后重新运行「书库路径」放书、进度从头记录。"
categories = ["tools"]
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"
activation = ["on-view:reader"]

[capabilities]
required = ["storage", "clipboard"]

[[contributes.commands]]
id = "prev-page"
title = "Moyu Book: 上一页"

[[contributes.commands]]
id = "next-page"
title = "Moyu Book: 下一页"

[[contributes.commands]]
id = "boss-key"
title = "Moyu Book: 老板键（隐藏/恢复）"

[[contributes.commands]]
id = "next-chapter"
title = "Moyu Book: 下一章"

[[contributes.commands]]
id = "prev-chapter"
title = "Moyu Book: 上一章"

[[contributes.commands]]
id = "jump"
title = "Moyu Book: 跳页"

[[contributes.commands]]
id = "chapters"
title = "Moyu Book: 章节目录"

[[contributes.commands]]
id = "switch-book"
title = "Moyu Book: 换书"

[[contributes.commands]]
id = "font-bigger"
title = "Moyu Book: 字号 +"

[[contributes.commands]]
id = "font-smaller"
title = "Moyu Book: 字号 −"

[[contributes.commands]]
id = "lines-more"
title = "Moyu Book: 每页行数 +"

[[contributes.commands]]
id = "lines-less"
title = "Moyu Book: 每页行数 −"

[[contributes.commands]]
id = "spacing-more"
title = "Moyu Book: 行距 +"

[[contributes.commands]]
id = "spacing-less"
title = "Moyu Book: 行距 −"

[[contributes.commands]]
id = "library-path"
title = "Moyu Book: 书库路径（往这里放 txt）"

[[contributes.commands]]
id = "load-sample"
title = "Moyu Book: 载入示例小说"

[[contributes.keymaps]]
command = "prev-page"
key = "Alt+Y"

[[contributes.keymaps]]
command = "next-page"
key = "Alt+L"

[[contributes.keymaps]]
command = "boss-key"
key = "Alt+I"

[[contributes.views]]
id = "reader"
title = "Moyu Book"
location = "bottom"
web = "web/index.html"

[[contributes.statusBar]]
id = "moyu-book"
text = "📖"
command = "jump"
